# These hint-only rules conflict with this package's boundary-heavy design:
# untrusted extension events and Hindsight JSON require runtime narrowing,
# conditional metadata fields are intentionally omitted with object spreads,
# and the client/provider classes mirror one cohesive external API. Keep all
# warning/error rules enabled; override only these non-actionable style hints.
id: large-class
language: TypeScript
severity: hint
message: "Disabled for pi-memory-orchestrator: cohesive boundary adapters may remain single classes"
rule:
  pattern: __pi_memory_orchestrator_disabled_hint__($$$ARGS)
---
id: long-parameter-list
language: TypeScript
